version: 2

models:
  - name: dim_dates
    description: >
      Full-refresh calendar dimension. Not constrained by the 5-minute
      dashboard SLA; Gold facts depend on its complete calendar coverage for
      partitioning and BI drill-down correctness. Date range is controlled by
      the dim_date_start_date / dim_date_end_date dbt vars.
    columns:
      - name: full_date
        description: Calendar date.
        tests:
          - unique
          - not_null
      - name: date_key
        description: Integer smart key YYYYMMDD.
        tests:
          - unique
          - not_null
      - name: day_of_week
        description: Spark dayofweek (1=Sunday ... 7=Saturday).
      - name: day_of_month
        description: Day number within the month.
      - name: day_of_year
        description: Day number within the year.
      - name: week_of_year
        description: ISO-ish week number within the year (Spark 'w' format).
      - name: month
        description: Month number (1-12).
      - name: quarter
        description: Quarter number (1-4).
      - name: year
        description: Calendar year.
      - name: is_weekend
        description: True when day_of_week is Sunday or Saturday.
      - name: holiday_name
        description: US holiday name for this date, null if not a holiday.
      - name: is_holiday
        description: True when full_date matches a US holiday.
        tests:
          - not_null
