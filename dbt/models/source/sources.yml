version: 2

sources:
  - name: finance_silver
    schema: finance_silver
    description: >
      Silver-layer tables in the Glue Data Catalog. Populated by a temporary
      Glue Crawler (scripts/glue_crawler.sh) over s3://<datalake_bucket>/silver/
      until the Silver layer migrates to Iceberg — drop/replace this source
      once that migration lands.
    tables:
      - name: silver_users
        description: Silver-layer users table, crawled from the S3 silver/ path.
        columns:
          - name: birth_month
            description: Month of birth (1-12).
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 1
                    max_value: 12

          - name: yearly_income
            description: Customer's yearly income in USD.

          - name: total_debt
            description: Customer's total outstanding debt.

          - name: credit_score
            description: Customer's credit score.
            tests:
              - dbt_utils.accepted_range:
                  arguments:
                    min_value: 300
                    max_value: 850

          - name: num_credit_cards
            description: Number of credit cards held by the customer.

      - name: silver_cards
        description: Silver-layer cards table, crawled from the S3 silver/ path.
        columns:
          - name: card_id
            description: Business/natural key of the card.
            tests:
              - not_null

          - name: client_id
            description: Owning customer's business key (silver_users.user_id).

          - name: expires
            description: Card expiration date, split into expires_month/expires_year in staging.

          - name: num_cards_issued
            description: Number of times this card has been reissued.

      - name: silver_transactions
        description: Silver-layer transactions table, crawled from the S3 silver/ path.
        columns:
          - name: transaction_id
            description: Business/natural key of the transaction.
            tests:
              - not_null

          - name: client_id
            description: Customer's business key (silver_users.user_id).

          - name: card_id
            description: Card's business key (silver_cards.card_id).

          - name: merchant_city
            description: Merchant location city, used to build gold.dim_geo.

          - name: merchant_state
            description: Merchant location state, used to build gold.dim_geo.

          - name: zip
            description: Merchant location zip code, used to build gold.dim_geo.

      - name: silver_mcc
        description: Silver-layer MCC (merchant category code) reference table, crawled from the S3 silver/ path.
        columns:
          - name: mcc_code
            description: Merchant category code, natural key.
            tests:
              - not_null

          - name: merchant_name
            description: Merchant category label.
