[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aws_pipeline"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "pyspark>=3.5.6,<4.0",
    "PyYAML>=6.0.3,<7.0",
    "reverse_geocoder",
    "holidays",
]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "jupyter (>=1.1.1,<2.0.0)",
    "venv-pack (>=0.2.0,<0.3.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "duckdb (>=1.5.3,<2.0.0)",
    "python-dotenv (>=1.0.1,<2.0.0)"
]
